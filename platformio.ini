[platformio]
default_envs = tone-test

[env:m5stack-cores3]
platform = espressif32@7.1.2
board = m5stack-cores3
framework = arduino
upload_speed = 460800
monitor_speed = 115200
build_src_filter = +<main.cpp> +<ir_link.cpp>
build_flags =
    -DARDUINO_M5STACK_CORES3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    m5stack/M5Unified@0.2.21
    m5stack/M5Unit-NFC@0.1.2
    crankyoldgit/IRremoteESP8266@2.9.0

[env:tone-test]
extends = env:m5stack-cores3
build_src_filter = -<*> +<tone_test.cpp> +<audio_modem.cpp>
lib_deps = m5stack/M5Unified@0.2.21

[env:acoustic-battle]
extends = env:m5stack-cores3
build_src_filter = -<*> +<acoustic_battle.cpp> +<audio_modem.cpp>
lib_deps =
    m5stack/M5Unified@0.2.21
    m5stack/M5Unit-NFC@0.1.2

[env:autonomous-raid]
extends = env:m5stack-cores3
build_src_filter = -<*> +<autonomous_raid.cpp>
lib_deps = m5stack/M5Unified@0.2.21

